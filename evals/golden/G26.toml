id = "G26"
title = "收纳：委托人一口气说了一堆事——先分类，再按类处理"
critical = true
capabilities = ["triage"]
milestone = "triage"
now = "2026-10-12 10:00"
notes = "先 triage 再动手：急的先办，能整件交出去的交出去，需要规划的规划，要委托人拍板的列出选项，信息记下。"

[[agents]]
id = "ops-reader"
description = "能读线上日志和监控的 agent"
capabilities = ["gcloud-logging:read", "metrics:read"]

[[agents]]
id = "dev"
description = "开发 agent：可以改 tapnow 仓库"
capabilities = ["repo:tapnow:write"]

[[people]]
id = "zhangsan"
name = "张三"
description = "后端负责人"
consent = true

[[steps]]
say = """这周事情有点多，我捋一下：
1. 线上支付偶尔报 500，今天得查清楚
2. 官网首页要改版，下个月上线
3. 要不要从阿里云迁到 AWS，我还没想好
4. 张三下周三请假
5. 想做一个给销售用的 AI 助手，还没想清楚做成啥样
6. 上周说的那个 README 已经有人写了，不用管了
你帮我安排一下"""
timeout = "6m"
  [[steps.expect]]
  type = "tool"
  called = ["triage"]
  why = "一堆事先分类"
  [[steps.expect]]
  type = "assignment"
  worker = "ops-reader"
  why = "急的先办：查日志交给 agent"
  [[steps.expect]]
  type = "judge"
  to = "principal"
  question = "这条回复是否把这些事按处理方式分了类（比如马上办的、交出去的、需要规划或探索的、要委托人拍板的、记下或不用管的），并且对“迁不迁 AWS”给出了需要委托人决定的问题或选项，而不是替他决定？"
  at_least = 0.6
  why = "分类之后按类处理；拍板的事留给委托人"
