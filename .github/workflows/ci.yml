name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Build
        run: go build -o bot-connect-ci ./cmd/bot-connect && ./bot-connect-ci version

  # Installers fetch the newest *published* release, so they run once it exists.
  install-scripts:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          BOT_CONNECT_INSTALL_DIR="$RUNNER_TEMP/bc" sh install.sh
          "$RUNNER_TEMP/bc/bot-connect" version
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BOT_CONNECT_INSTALL_DIR = "$env:RUNNER_TEMP\bc"
          ./install.ps1
          & "$env:RUNNER_TEMP\bc\bot-connect.exe" version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm package (from this checkout)
        shell: bash
        run: |
          cd npm && npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g --prefix "$RUNNER_TEMP/npmprefix" "$RUNNER_TEMP"/bot-connect-*.tgz
          if [ "$RUNNER_OS" = Windows ]; then "$RUNNER_TEMP/npmprefix/bot-connect" version; else "$RUNNER_TEMP/npmprefix/bin/bot-connect" version; fi
