name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: make vet
      - name: Test
        run: make test
      - name: Build
        run: make build && ./bin/bot-connect version
      - name: Install script (newest release)
        run: |
          BOT_CONNECT_INSTALL_DIR="$RUNNER_TEMP/bc" sh install.sh
          "$RUNNER_TEMP/bc/bot-connect" version
